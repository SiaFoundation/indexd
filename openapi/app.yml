            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve:
                  type: boolean
                  description: Whether to approve the application connection request or not.
      responses:
        "204":
          description: Request processed successfully
        "401":
          description: Invalid connect key
        "403":
          description: Connect key exhausted
        "404":
          description: Request invalid or expired
  /auth/connect/{requestID}/status:
    get:
      tags:
        - auth
      summary: Check the status of a connection request
      description: >
        Returns whether the user has approved or rejected the connection request. Must be signed with the same ephemeral key used in the initial `POST /auth/connect` request. If approved, the response includes the `userSecret` used to derive the application key.

      operationId: authConnectStatus
      parameters:
        - name: requestID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConnectStatusResponse"
            application/cbor:
              schema:
                $ref: "#/components/schemas/AuthConnectStatusResponse"
        "401":
          description: Signed with a different ephemeral key than the one used to initiate the request
        "404":
          description: Request invalid or expired
  /auth/connect/{requestID}/register:
    post:
      tags:
        - auth
      summary: Finalize application registration after approval
      description: >
        Registers the application key. The request URL must be signed with the ephemeral key from the initial connect request. The body contains the application public key and a proof-of-possession signature: `appKey.Sign(hash("registerAppKey" + ephemeralPubKey + requestID))`. This proves the caller both controls the ephemeral key and knows the private key of the app key being registered. Registering consumes the connection request, so it only ever registers one app key; any further attempt returns `404`.

      operationId: authRegister
      parameters:
        - name: requestID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appKey
                - signature
              properties:
                appKey:
                  allOf:
                    - $ref: "#/components/schemas/PublicKey"
                    - description: The application public key to register
                signature:
                  type: string
                  format: byte
                  description: >
                    ed25519 signature by `appKey` over `hash("registerAppKey" + ephemeralPubKey + requestID)`, proving ownership of the application key

      responses:
        "204":
          description: Application registered successfully
        "401":
          description: Signed with a different ephemeral key than the one used to initiate the request, or invalid proof-of-possession signature
        "403":
          description: Connect key exhausted or request not approved
        "404":
          description: Unknown request ID, or the request was already used to register an app key
        "410":
          description: Request expired
